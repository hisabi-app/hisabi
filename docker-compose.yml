version: '3'
services:
    app:
        build:
            context: ./
        ports:
            - "80:80"
        networks:
            - hisabi
        depends_on:
            - mysql
    mysql:
        image: 'mysql/mysql-server:8.0'
        # Localhost only, so the database and its default passwords aren't reachable from the network
        ports:
            - '127.0.0.1:3306:3306'
        environment:
            MYSQL_ROOT_PASSWORD: 'root'
            MYSQL_ROOT_HOST: "%"
            MYSQL_DATABASE: 'hisabi'
            MYSQL_USER: 'hisabi'
            MYSQL_PASSWORD: 'hisabi'
        volumes:
            - 'hisabimysql:/var/lib/mysql'
        networks:
            - hisabi
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-proot"]
            retries: 3
            timeout: 5s
networks:
    hisabi:
        driver: bridge
volumes:
    hisabimysql:
        driver: local
